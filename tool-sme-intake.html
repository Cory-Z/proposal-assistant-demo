<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: question cards on the left, sticky progress / estimate / hand-off panel on the right. Required vs optional badges carry the two-step ownership. */
:root{
  --bg:#F5F8FA; --surface:#FFFFFF; --sunk:#ECF4F5; --fg:#15242E; --muted:#5A6974; --line:#D8E5E6;
  --navy:#0C273A; --purple:#196972; --pink:#F4B782; --pink-ink:#9C5F2A; --input:#FFFBE6; --input-line:#E6D98A;
  --req-bg:#E3F4EA; --req-fg:#1F6B44; --opt-bg:#FDF2E9; --opt-fg:#7A491F; --co-bg:#E4E8F7; --co-fg:#27367A; --ok:#1F7A4D;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif; --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D171F; --surface:#16232C; --sunk:#1E2D38; --fg:#EAF1F6; --muted:#A2B2BE; --line:#2C3E4B;
  --navy:#C6E0F2; --purple:#9BE0E8; --pink:#F4B782; --pink-ink:#F6CBA6; --input:#262240; --input-line:#4F6F86;
  --req-bg:#16301F; --req-fg:#8FE0B3; --opt-bg:#17363A; --opt-fg:#F7DCC4; --co-bg:#1C2346; --co-fg:#B9C4F5; --ok:#7FD6A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D171F; --surface:#16232C; --sunk:#1E2D38; --fg:#EAF1F6; --muted:#A2B2BE; --line:#2C3E4B;
  --navy:#C6E0F2; --purple:#9BE0E8; --pink:#F4B782; --pink-ink:#F6CBA6; --input:#262240; --input-line:#4F6F86;
  --req-bg:#16301F; --req-fg:#8FE0B3; --opt-bg:#17363A; --opt-fg:#F7DCC4; --co-bg:#1C2346; --co-fg:#B9C4F5; --ok:#7FD6A6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--pink);padding-bottom:14px}
.logo{background:#fff;border-radius:6px;padding:6px 10px;display:inline-flex}.logo img{height:30px;width:auto;display:block}
.step{font:600 .74rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--pink-ink)}
h1{font:600 1.45rem/1.2 var(--f-display);color:var(--navy);margin:0}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 0;max-width:72ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card + .card{margin-top:12px}
.card>h2{display:flex;gap:12px;align-items:center;margin:0;padding:12px 16px;font:600 1rem var(--f-display);border-bottom:1px solid var(--line)}
.num{font:600 .8rem var(--f-mono);color:var(--surface);background:var(--purple);border-radius:4px;padding:2px 7px;min-width:28px;text-align:center}
.state{margin-left:auto;font:500 .78rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.state.done{color:var(--ok)}
.qs{padding:6px 16px 16px;display:grid;gap:14px}
.q{display:grid;gap:6px}
.lab{font-weight:600;font-size:.96rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.badge{font:700 .68rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;white-space:nowrap}
.b-req{background:var(--req-bg);color:var(--req-fg)}.b-opt{background:var(--opt-bg);color:var(--opt-fg)}.b-co{background:var(--co-bg);color:var(--co-fg)}
.hint{font-size:.83rem;color:var(--muted);margin-top:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.chip:hover{border-color:var(--purple)}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.chip.assumed{border-style:dashed;border-color:var(--purple)}
.chip:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
select,input[type=text]{font:inherit;font-size:.95rem;padding:6px 8px;border:1px solid var(--input-line);background:var(--input);color:var(--fg);border-radius:4px;max-width:100%}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:.88rem}
th{background:var(--navy);color:var(--bg);font-weight:600;text-align:left;padding:6px;font-size:.76rem;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:4px}
td select,td input{width:100%}
button.btn{font:inherit;font-size:.9rem;border:1px solid var(--purple);color:var(--purple);background:transparent;border-radius:4px;padding:6px 12px;cursor:pointer}
button.btn:hover{background:var(--sunk)} button.primary{background:var(--purple);color:#fff}
button.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1rem}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px}
@media (max-width:920px){aside{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.panel h3{margin:0;font:600 .98rem var(--f-display);color:var(--navy)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pink);width:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.88rem}
.steps a{color:var(--fg);text-decoration:none;display:flex;justify-content:space-between;gap:8px}.steps a:hover{color:var(--purple)}
.tick{font-family:var(--f-mono);color:var(--muted)}.tick.done{color:var(--ok)}
.est{display:grid;gap:2px;font-size:.88rem}.est div{display:flex;justify-content:space-between;gap:10px}.est b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.grand{display:flex;justify-content:space-between;align-items:baseline;background:var(--navy);color:var(--bg);border-radius:6px;padding:9px 12px}.grand b{font:600 1.2rem var(--f-mono)}
.note{font-size:.8rem;color:var(--muted)} .toast{font-size:.85rem;color:var(--ok)}
textarea{width:100%;min-height:150px;font:12px/1.45 var(--f-mono);background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px}
.missing{background:var(--opt-bg);color:var(--opt-fg);border-radius:4px;padding:8px 10px;font-size:.85rem}.missing ul{margin:4px 0 0;padding-left:18px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.smeval{font-size:.85rem;color:var(--muted)} .smeval b{color:var(--fg)}
.import{display:grid;gap:8px}
.rfqn{font-size:.84rem;color:#196972;background:#EFFAFB;border-left:3px solid #F4B782;padding:5px 9px;border-radius:4px;margin:6px 0}
.rfqbox{border-color:#F4B782}
.err{color:var(--opt-fg);font-size:.88rem}
</style>

   if(q.o==="S"&&q.type!=="groups"&&!q.optional&&!filled(smeVal(q.id))&&SME)m.push(`(SME left blank) ${q.l}`);

  const st=document.getElementById("st_"+(i+1));if(st){st.textContent=req.length?(ok?"Done":`${d}/${req.length} required`):"Optional";st.className="state"+(ok&&req.length?" done":"")}
